<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Sparky-OS</title>
  <desc id="description">Daniel Ramos's SparkyLinux work, with Paweł Pijanowski. Two offset layers symbolize the left and right eye of a stereo pair.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#18243c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce0cc"/>
      <stop offset="1" stop-color="#b5a0ff"/>
    </linearGradient>
  </defs>
<rect width="1200" height="280" rx="20" fill="url(#background)"/>
  <path d="M44 48H112" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="44" y="107" fill="#f2f6ff" font-size="39" font-weight="700">Sparky-OS</text>
    <text x="44" y="150" fill="#c9d5e8" font-size="22">SparkyLinux editions · Stereo 3D</text>
    <text x="44" y="186" fill="#c9d5e8" font-size="22">Business server and client</text>
    <text x="44" y="237" fill="#75dfcd" font-size="16" letter-spacing="1.3">DANIEL RAMOS · WITH PAWEŁ PIJANOWSKI · BASED ON SPARKYLINUX</text>
  </g>
  <g stroke-width="2" stroke-linejoin="round">
    <path d="M840 120L960 68L1080 120L960 172Z" fill="#252f4d" stroke="#b5a0ff"/>
    <path d="M880 150L1000 98L1120 150L1000 202Z" fill="#1c464e" stroke="#5ce0cc"/>
  </g>
  <g fill="#5ce0cc">
    <circle cx="840" cy="120" r="5"/>
    <circle cx="880" cy="150" r="5"/>
  </g>
</svg>
